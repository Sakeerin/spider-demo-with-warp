version: "3.9"

services:
  db:
    image: postgres:16-alpine
    container_name: spider_db
    environment:
      POSTGRES_USER: spider
      POSTGRES_PASSWORD: spiderpass
      POSTGRES_DB: spiderdb
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U spider -d spiderdb"]
      interval: 5s
      timeout: 5s
      retries: 10
    volumes:
      - db_data:/var/lib/postgresql/data

  redis:
    image: redis:7-alpine
    container_name: spider_redis
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

  api:
    build:
      context: ./apps/api
      dockerfile: Dockerfile
    container_name: spider_api
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    environment:
      NODE_ENV: production
      PORT: 3001
      DATABASE_URL: postgresql://spider:spiderpass@db:5432/spiderdb?schema=public
      REDIS_URL: redis://redis:6379
      ADMIN_API_KEY: demo-key
      ADMIN_JWT_SECRET: supersecretjwt
      # S3 (leave blank for local uploads in dev)
      AWS_S3_BUCKET: ""
      AWS_S3_REGION: ""
      AWS_ACCESS_KEY_ID: ""
      AWS_SECRET_ACCESS_KEY: ""
      # SLA: minutes before first-touch alert
      LEAD_SLA_FIRST_TOUCH_MIN: 60
    ports:
      - "3001:3001"

  web:
    build:
      context: ./apps/web
      dockerfile: Dockerfile
    container_name: spider_web
    depends_on:
      api:
        condition: service_started
    environment:
      NODE_ENV: production
      # Client-side code runs in the browser; must use host-accessible URL
      NEXT_PUBLIC_API_URL: http://localhost:3001
      # For any server-side calls from within the container, use the service name
      API_INTERNAL_URL: http://api:3001
    ports:
      - "3000:3000"

volumes:
  db_data:
